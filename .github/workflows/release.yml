name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: krep-linux-x86_64
          - os: macos-latest
            arch: arm64
            artifact: krep-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build portable binaries and run all tests
        run: make -j2 PORTABLE=1 ci

      - name: Offline benchmark smoke test
        run: python3 test/benchmark_release.py --runs 1 --size-mib 2 --output-lines 128

      - name: Package binary
        run: |
          mkdir -p dist
          cp krep LICENSE README.md CHANGELOG.md dist/
          cd dist
          tar czf ${{ matrix.artifact }}.tar.gz krep LICENSE README.md CHANGELOG.md
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYNOTES' > release-notes.md
          from pathlib import Path
          import os
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n## [', 1)[0]
          print(section.split('\n', 1)[1].strip())
          PYNOTES
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) | sort)
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag --title "krep ${{ github.ref_name }}" \
              --notes-file release-notes.md "${files[@]}"
          fi
